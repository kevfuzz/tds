<!doctype html>
<html lang="en" class="app-dark">
  <head>
    <meta charset="utf-8" />
    <title>RWP2 Workbench</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      CSP meta for the shell renderer (04 §6). The shell loads only its own
      bundle; content apps run in isolated <webview> renderers (separate origin,
      not framed here) so no remote script/style/connect origins are permitted.
      'unsafe-inline' style is required by Angular/PrimeNG runtime style
      injection; there is no 'unsafe-eval' — the shell ships AOT-compiled.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'"
    />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <rwp-root></rwp-root>
  </body>
</html>
